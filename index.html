<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS-700 Exam Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MS-700 Exam Simulator</h1>
    <p>Managing Microsoft Teams</p>
</header>

<main id="app">

    <h2>Welcome to the MS-700 Practice Exam</h2>

    <p>Test your knowledge of Microsoft Teams administration.</p>

    <div class="exam-info">
        <p>60 Questions</p>
        <p>100 Minutes</p>
        <p>Practice and Exam Modes</p>
    </div>

    <button onclick="startExam('practice')">
        Practice Mode
    </button>

    <button onclick="startExam('exam')">
        Exam Mode
    </button>

</main>

<script src="questions.js"></script>
<script src="script.js"></script>

</body>
</html>
